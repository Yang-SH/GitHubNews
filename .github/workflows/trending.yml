name: Trending Reports

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00，每天一次
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 防止两次运行重叠产生提交冲突
concurrency:
  group: trending-reports
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch trending and generate reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_trending.py

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports README.md
          if [ -d data ]; then git add data; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update trending reports $(date -u +'%Y-%m-%d')"
            git push
          fi
