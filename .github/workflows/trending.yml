name: Trending Reports

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00，每天一次
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 防止两次运行重叠产生提交冲突
concurrency:
  group: trending-reports
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史，保证失败重试场景下 git pull --rebase 可用
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch trending and generate reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_trending.py

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports README.md
          if [ -d data ]; then git add data; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update trending reports $(date -u +'%Y-%m-%d')"
            # 运行期间若有手动推送，先 rebase 再推，避免当天报告丢失
            git pull --rebase origin main
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL 未设置，跳过通知。"
            exit 0
          fi
          # 适配企业微信/钉钉机器人的 text 消息格式；其他渠道请自行调整 payload
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"GitHubNews trending 报告生成失败，请检查 Actions 日志（$(date -u +'%F %TZ')）\"}}" \
            || echo "通知发送失败（不影响主流程判断）。"
